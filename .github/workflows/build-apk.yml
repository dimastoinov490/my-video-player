name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-proot-runtime:
    name: Build PRoot runtime (${{ matrix.android_abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - termux_arch: aarch64
            android_abi: arm64-v8a
          - termux_arch: arm
            android_abi: armeabi-v7a
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore cached PRoot runtime
        id: proot-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs/${{ matrix.android_abi }}
          key: termux-proot-${{ matrix.android_abi }}-8eb3169dbd10d71ef26e2847191f9ae2a452ab2e-${{ hashFiles('.github/scripts/build-proot-runtime.sh') }}

      - name: Install ELF packaging tools
        if: steps.proot-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils dpkg-dev patchelf

      - name: Build pinned official Termux PRoot runtime
        if: steps.proot-cache.outputs.cache-hit != 'true'
        env:
          TERMUX_PACKAGES_REF: 8eb3169dbd10d71ef26e2847191f9ae2a452ab2e
        run: bash .github/scripts/build-proot-runtime.sh "${{ matrix.termux_arch }}" "${{ matrix.android_abi }}"

      - name: Validate restored PRoot runtime
        run: |
          set -euo pipefail
          for file in libproot.so libproot_loader.so libtalloc.so libandroid-shmem.so; do
            test -s "app/src/main/jniLibs/${{ matrix.android_abi }}/$file"
          done

      - name: Upload PRoot runtime
        uses: actions/upload-artifact@v4
        with:
          name: linux-proot-${{ matrix.android_abi }}
          path: app/src/main/jniLibs/${{ matrix.android_abi }}/*
          if-no-files-found: error
          retention-days: 1

  build:
    needs: prepare-proot-runtime
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Restore ARM64 PRoot runtime
        uses: actions/download-artifact@v4
        with:
          name: linux-proot-arm64-v8a
          path: app/src/main/jniLibs/arm64-v8a

      - name: Restore ARMv7 PRoot runtime
        uses: actions/download-artifact@v4
        with:
          name: linux-proot-armeabi-v7a
          path: app/src/main/jniLibs/armeabi-v7a

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # Release signing secrets are deliberately never exposed to pull-request builds.
      - name: Restore Release Keystore
        if: github.event_name != 'pull_request'
        env:
          KEY_STORE_BASE64: ${{ secrets.KEY_STORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEY_STORE_BASE64:-}" ]; then
            echo "::error::Missing GitHub Actions secret KEY_STORE_BASE64"
            exit 1
          fi
          printf '%s' "$KEY_STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"
          test -s "$RUNNER_TEMP/release-keystore.jks"
          chmod 600 "$RUNNER_TEMP/release-keystore.jks"

      - name: Build Signed Release APK
        if: github.event_name != 'pull_request'
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release-keystore.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret $name"
              exit 1
            fi
          done
          ./gradlew assembleRelease --stacktrace

      - name: Verify Release APK Signature
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload Release APK Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app/build/outputs/apk/release/app-release.apk
