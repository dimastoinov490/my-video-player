<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nexora Player Screen v3</title>
<style>
/* ===========================================================================
   NEXORA PLAYER SCREEN (только ландшафт, как на скриншоте). Эталон оформления.
   1u = 1/1774 ширины экрана (размеры сняты со скриншота 1774x887, пропорции 2:1).
   Телефон 2160x1080 px при 403 dpi = 857x429 dp -> 1u = 857/1774 = 0.483 dp.
   Верхняя панель привязана к верху, полоса перемотки и нижние кнопки к низу.
   Большой кнопки Play по центру НЕТ: остаётся только малая кнопка Play в нижнем ряду.
   Фон условный: в приложении за интерфейсом идёт видео.
   ЦВЕТА:  cyan #00d8ff   blue #4a80ff   purple #a63ef6
           заголовок файла #c4cbdb   время слева #00d4e5   время справа #a98cff
           ползунок #279dfe
   Свечения у кнопки Play НЕТ (только градиентное кольцо).
   =========================================================================== */
:root{--bg:#000104;--cyan:#00d8ff;--blue:#4a80ff;--purple:#a63ef6;--title:#c4cbdb}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;overflow:hidden;font-family:"Google Sans",Roboto,"Segoe UI",system-ui,sans-serif;color:#fff;user-select:none}
.app{container-type:inline-size;width:100%;height:100%}
.screen{--u:.056370cqw;position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg)}
.gdefs{position:absolute;width:0;height:0;overflow:hidden}
svg{display:block;overflow:visible}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.abs{position:absolute}
.vid{position:absolute;inset:0;background:radial-gradient(70% 60% at 50% 35%,#04081a 0%,var(--bg) 70%)}

/* ---------- верхняя панель ---------- */
.logo{left:calc(99*var(--u));top:calc(120*var(--u));width:calc(62*var(--u));height:calc(64*var(--u));transform:translate(-50%,-50%)}
.logo svg{width:100%;height:100%}
.brand{left:calc(160*var(--u));top:calc(118*var(--u));transform:translateY(-50%);font-size:calc(36*var(--u));font-weight:600;letter-spacing:calc(0.5*var(--u));line-height:1;
  background:linear-gradient(90deg,#74f0ff 0%,#8fa6ff 60%,#9a5cff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.title{left:calc(326*var(--u));top:calc(118*var(--u));transform:translateY(-50%);right:calc(274*var(--u));font-size:calc(29.5*var(--u));font-weight:400;line-height:1;color:var(--title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cast{right:calc(196*var(--u));top:calc(121*var(--u));width:calc(52*var(--u));height:calc(42*var(--u));transform:translate(50%,-50%)}
.dots-top{right:calc(78*var(--u));top:calc(122*var(--u));width:calc(16*var(--u));height:calc(52*var(--u));transform:translate(50%,-50%)}

/* ---------- время и перемотка ---------- */
.time{font-size:calc(22*var(--u));font-weight:600;line-height:1;bottom:calc(254*var(--u));transform:translateY(50%);font-variant-numeric:tabular-nums}
.time.cur{left:calc(68*var(--u));color:#00d4e5}
.time.dur{right:calc(60*var(--u));color:#a98cff}
.seek{left:calc(68*var(--u));right:calc(60*var(--u));bottom:calc(221*var(--u));height:calc(44*var(--u));transform:translateY(50%);touch-action:none;cursor:pointer}
.seek .line{position:absolute;left:0;right:0;top:50%;height:calc(5*var(--u));margin-top:calc(-2.5*var(--u));border-radius:calc(3*var(--u));background:linear-gradient(90deg,#00baf1 0%,#606df7 55%,#a63ef6 100%)}
.seek .knob{position:absolute;top:50%;left:0;width:calc(34*var(--u));height:calc(34*var(--u));margin:calc(-17*var(--u)) 0 0 calc(-17*var(--u));border-radius:50%;background:radial-gradient(circle at 40% 35%,#6cc0ff,#279dfe 70%);box-shadow:0 0 calc(14*var(--u)) rgba(39,157,254,.55)}

/* ---------- нижняя строка кнопок ---------- */
.ib{transform:translate(-50%,50%);transition:transform .12s}
.ib:active{transform:translate(-50%,50%) scale(.88)}
.ib.r{transform:translate(50%,50%)}.ib.r:active{transform:translate(50%,50%) scale(.88)}
.b-sub{left:calc(93*var(--u));bottom:calc(127*var(--u));width:calc(52*var(--u));height:calc(46*var(--u))}
.b-rep{left:calc(227*var(--u));bottom:calc(127*var(--u));width:calc(50*var(--u));height:calc(46*var(--u))}
.b-prev{left:calc(735*var(--u));bottom:calc(127*var(--u));width:calc(40*var(--u));height:calc(36*var(--u))}
.b-play{left:calc(887*var(--u));bottom:calc(127*var(--u));width:calc(80*var(--u));height:calc(80*var(--u))}
.b-next{left:calc(1038*var(--u));bottom:calc(127*var(--u));width:calc(40*var(--u));height:calc(36*var(--u))}
.b-fit{right:calc(216*var(--u));bottom:calc(127*var(--u));width:calc(56*var(--u));height:calc(46*var(--u))}
.b-more{right:calc(85*var(--u));bottom:calc(127*var(--u));width:calc(16*var(--u));height:calc(48*var(--u))}
.ib svg,.cast svg,.dots-top svg,.b-play svg{width:100%;height:100%}
/* ---------- увеличенные зоны нажатия (>= 48dp, на экране 403dpi это ~100u) ---------- */
.logo::after,.cast::after,.dots-top::after,.ib::after{content:"";position:absolute;left:calc(-30*var(--u));right:calc(-30*var(--u));top:calc(-30*var(--u));bottom:calc(-30*var(--u))}

/* Если файл открыт на телефоне в вертикальном положении, поворачиваем экран на 90°,
   чтобы он выглядел так же, как на скриншоте (ландшафт). В приложении плеер идёт в ландшафте. */
@media (orientation:portrait){
  .app{position:fixed;left:0;top:0;width:100vh;height:100vw;transform-origin:0 0;transform:translateX(100vw) rotate(90deg)}
}
.hide{display:none}
</style>
</head>
<body>
<div class="app"><div class="screen" id="screen">

<!-- общие градиенты для иконок -->
<svg class="gdefs" aria-hidden="true"><defs>
  <linearGradient id="gCyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00dcff"/><stop offset="1" stop-color="#3d8bff"/></linearGradient>
  <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3fb0ff"/><stop offset="1" stop-color="#8a62ff"/></linearGradient>
  <linearGradient id="gPurple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6a8bff"/><stop offset="1" stop-color="#b05cff"/></linearGradient>
  <linearGradient id="gAll" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00d8ff"/><stop offset=".55" stop-color="#5a78ff"/><stop offset="1" stop-color="#a63ef6"/></linearGradient>
  <linearGradient id="gRing" x1="0" y1="0.25" x2="1" y2="0.75"><stop offset="0" stop-color="#00e2ff"/><stop offset=".5" stop-color="#4f8dff"/><stop offset="1" stop-color="#a24ee6"/></linearGradient>
  <linearGradient id="gLogo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00d8ff"/><stop offset=".6" stop-color="#5a78ff"/><stop offset="1" stop-color="#9a45f2"/></linearGradient>
</defs></svg>

<div class="vid" id="video-area"></div>

<!-- ===== ВЕРХНЯЯ ПАНЕЛЬ ===== -->
<button class="abs logo" data-action="logo" aria-label="Nexora">
  <svg viewBox="0 0 62 64"><rect x="2.2" y="2.2" width="57.6" height="59.6" rx="15" fill="#03071a" stroke="url(#gLogo)" stroke-width="4.4"/>
  <path d="M23 18.5v27l22-13.5z" fill="#abe2ff" stroke="#abe2ff" stroke-width="3" stroke-linejoin="round"/></svg>
</button>
<div class="abs brand">Nexora</div>
<div class="abs title" id="title">Django_osvobojdennyi_HDRip_Kinosimka RU1</div>
<button class="abs cast" data-action="cast" aria-label="Трансляция">
  <svg viewBox="0 0 52 42" fill="none" stroke="url(#gAll)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3h30a7 7 0 0 1 7 7v22a7 7 0 0 1-7 7H28"/><path d="M3 18a21 21 0 0 1 21 21"/><path d="M3 28a11 11 0 0 1 11 11"/><circle cx="4.5" cy="37.5" r="1.2" fill="url(#gAll)"/></svg>
</button>
<button class="abs dots-top" data-action="menu" aria-label="Меню">
  <svg viewBox="0 0 16 52"><circle cx="8" cy="7" r="4.4" fill="#8092fa"/><circle cx="8" cy="26" r="4.4" fill="#8a78fa"/><circle cx="8" cy="45" r="4.4" fill="#9560f9"/></svg>
</button>

<!-- ===== ВРЕМЯ И ПЕРЕМОТКА ===== -->
<div class="abs time cur" id="t-cur">0:00</div>
<div class="abs time dur" id="t-dur">2:45:22</div>
<div class="abs seek" id="seek" role="slider" aria-label="Перемотка"><div class="line"></div><div class="knob" id="knob"></div></div>

<!-- ===== НИЖНЯЯ СТРОКА КНОПОК ===== -->
<button class="abs ib b-sub" data-action="subtitles" aria-label="Субтитры">
  <svg viewBox="0 0 52 46" fill="none" stroke="url(#gCyan)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="3" width="48" height="40" rx="5"/><path d="M10 15h32M10 24h32M10 33h13M29 33h13"/></svg>
</button>
<button class="abs ib b-rep" data-action="repeat" aria-label="Повтор">
  <svg viewBox="0 0 50 46" fill="none" stroke="url(#gBlue)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 21c1.5-8 8.5-14 17.5-14 5.5 0 9.5 2 12.5 5.5"/><path d="M38 3v10.5H27.5"/><path d="M43 25c-1.5 8-8.5 14-17.5 14-5.5 0-9.5-2-12.5-5.5"/><path d="M12 43V32.5h10.5"/></svg>
</button>
<button class="abs ib b-prev" data-action="prev" aria-label="Назад">
  <svg viewBox="0 0 40 36" fill="none" stroke="url(#gCyan)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="4" height="30" rx="2" fill="url(#gCyan)" stroke="none"/><path d="M34 5.5v25L12 18z"/></svg>
</button>
<button class="abs ib b-play" data-action="play" aria-label="Играть / пауза">
  <svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="37" fill="none" stroke="url(#gRing)" stroke-width="4"/>
    <path class="ic-play" d="M33 27v26l22-13z" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
    <g class="ic-pause hide" fill="#fff"><rect x="29" y="27" width="8" height="26" rx="2"/><rect x="43" y="27" width="8" height="26" rx="2"/></g></svg>
</button>
<button class="abs ib b-next" data-action="next" aria-label="Вперёд">
  <svg viewBox="0 0 40 36" fill="none" stroke="url(#gPurple)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="33" y="3" width="4" height="30" rx="2" fill="url(#gPurple)" stroke="none"/><path d="M6 5.5v25L28 18z"/></svg>
</button>
<button class="abs ib r b-fit" data-action="pip" aria-label="Картинка в картинке / формат кадра">
  <svg viewBox="0 0 56 46" fill="none" stroke="url(#gCyan)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="2" width="52" height="33" rx="4"/><path d="M20 43h16M28 35v8"/>
    <path d="M10 14v-4h4M46 14v-4h-4M10 23v4h4M46 23v4h-4"/></svg>
</button>
<button class="abs ib r b-more" data-action="more" aria-label="Ещё">
  <svg viewBox="0 0 16 48"><circle cx="8" cy="6" r="4.4" fill="#969af7"/><circle cx="8" cy="24" r="4.4" fill="#9c86f8"/><circle cx="8" cy="42" r="4.4" fill="#a070f9"/></svg>
</button>

</div></div>

<script>
/* ---------- Демо-логика предпросмотра. В приложении состояние приходит из плеера. ---------- */
const $ = id => document.getElementById(id);
let playing = false, dur = 2*3600+45*60+22, pos = 0;
const fmt = s => { s=Math.max(0,Math.floor(s)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60;
  return h>0 ? h+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0') : m+':'+String(x).padStart(2,'0'); };
function render(){
  const f = dur>0 ? Math.min(1,Math.max(0,pos/dur)) : 0;
  $('knob').style.left = (f*100)+'%';
  $('t-cur').textContent = fmt(pos); $('t-dur').textContent = fmt(dur);
  document.querySelectorAll('.ic-play').forEach(e=>e.classList.toggle('hide',playing));
  document.querySelectorAll('.ic-pause').forEach(e=>e.classList.toggle('hide',!playing));
}
/* API для Android: window.setPlayerState({title, pos, dur, playing}) (pos, dur в секундах) */
window.setPlayerState = function(s){
  if (s.title!==undefined) $('title').textContent = s.title;
  if (s.dur!==undefined) dur = s.dur; if (s.pos!==undefined) pos = s.pos; if (s.playing!==undefined) playing = !!s.playing;
  render();
};
/* Кнопки: data-action = play | prev | next | subtitles | repeat | pip | more | cast | menu | logo */
document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{
  const a = b.dataset.action;
  if (a==='play') { playing=!playing; render(); }
  if (window.AndroidBridge && window.AndroidBridge.onPlayerAction) window.AndroidBridge.onPlayerAction(a);
}));
/* Перемотка касанием и перетаскиванием */
const seek = $('seek');
function seekAt(ev){ const r=seek.getBoundingClientRect(); const x=(ev.touches?ev.touches[0].clientX:ev.clientX);
  const f=Math.min(1,Math.max(0,(x-r.left)/r.width)); pos=f*dur; render();
  if (window.AndroidBridge && window.AndroidBridge.onPlayerSeek) window.AndroidBridge.onPlayerSeek(Math.round(pos*1000)); }
let drag=false;
seek.addEventListener('pointerdown',e=>{drag=true;seek.setPointerCapture(e.pointerId);seekAt(e);});
seek.addEventListener('pointermove',e=>{if(drag)seekAt(e);});
seek.addEventListener('pointerup',()=>drag=false);
render();
</script>
</body>
</html>
